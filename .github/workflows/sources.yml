name: Sources
on:
  schedule:
    - cron: '23 12 * * *'
    - cron: '43 12 * * 1'
  workflow_dispatch:
    inputs:
      mode:
        description: Source check or patch hunt
        type: choice
        options: [watch, hunt]
        default: watch
permissions:
  contents: read
concurrency:
  group: sources
  cancel-in-progress: false
jobs:
  sources:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MODE: ${{ github.event.inputs.mode || (github.event.schedule == '43 12 * * 1' && 'hunt' || 'watch') }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .state
          key: sources-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: sources-v1-
      - run: python3 tools/watch.py "$MODE"
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        if: always()
        with:
          path: .state
          key: sources-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Publish run summary
        if: always()
        run: |
          if [ -f "runs/$MODE.md" ]; then
            cat "runs/$MODE.md" >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: sources-${{ env.MODE }}-${{ github.run_id }}
          path: runs/
          retention-days: 30
